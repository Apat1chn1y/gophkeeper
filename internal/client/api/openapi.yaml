openapi: 3.0.3
info:
  title: GophKeeper API
  description: |
    HTTP/JSON API of the GophKeeper client-server password manager.

    All endpoints except `register` and `login` require a bearer token
    issued by `login`. Item payloads (`data`) are transmitted in plaintext
    over the wire and encrypted at rest on the server with AES-256-GCM;
    the server never persists the plaintext form. Conflict resolution is
    last-write-wins on `updated_at`, with server-side monotonicity
    guarantees.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: auth
    description: Registration and session issuing
  - name: items
    description: Item CRUD
  - name: sync
    description: Incremental client-server synchronisation

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate and obtain a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sync/push:
    post:
      tags: [sync]
      summary: Push locally-changed items to the server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Canonical versions of every pushed item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sync/pull:
    post:
      tags: [sync]
      summary: Pull items changed on the server since a timestamp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequest'
      responses:
        '200':
          description: Delta since the requested timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/items:
    get:
      tags: [items]
      summary: List all live items owned by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/items/{id}:
    get:
      tags: [items]
      summary: Fetch a single item
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemID'
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [items]
      summary: Soft-delete an item
      description: |
        Marks the item as deleted by setting `deleted_at` and bumping
        `updated_at` monotonically. The tombstone is retained so the
        deletion propagates to other devices on the next pull.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemID'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ItemID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Item does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Username is already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "Signed JWT to send as `Authorization: Bearer <token>`"
        user_id:
          type: string

    Item:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [credentials, text, binary, card]
        title:
          type: string
        data:
          type: string
          format: byte
          description: Base64-encoded plaintext payload
        metadata:
          type: string
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    PushRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'

    PushResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'

    PullRequest:
      type: object
      properties:
        since:
          type: string
          format: date-time
          description: Return items whose `updated_at` is strictly after this value

    PullResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        now:
          type: string
          format: date-time
          description: Server clock at the moment of the pull; pass as the next `since`

    Error:
      type: object
      properties:
        error:
          type: string